  console.log('Export Excel')
  /// Export Report Excel
  async function exportToExcel(dataArray, fileName = "data.xlsx") {
      console.log('dataArray', dataArray)
      if (typeof XLSX === "undefined") {
          await import("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      }
      let rows = [];
      
       
      dataArray.forEach((item) => {

          if (item?.estado === "En trámite área gestión") {
          rows.push({
              ["Prioridad"]: item?.priorizar ? 'Si' : 'No',
              ["Fecha de Solicitud"]: item?.fechaSolicitud?.split('T')[0] || "",
              ["Número de solicitud"]: item?.codigoRadicado || "",
              ["NIT Constructora"]: item?.numeroDocumento || "",
              ["Nombre Constructora"]: item?.nombreAutorizado || "",
              ["Numero de negocio"]: item?.numeroNegocio || "",
              ["Nombre de negocio"]: item?.nombreNegocio || "",
              ["Tipo anexo"]: item?.numeroAnexoContable || "",
              ["Municipio"]: item?.municipio || "",
              ["Estado"]: item?.estado || "",
              ["Año anexo"]: item?.anioAnexo || "",
              ["Mes Anexo"]: item?.mesAnexo || "",
              ["Valor total del anexo"]: new Intl.NumberFormat('es-CO', {
                  style: 'currency',
                  currency: 'COP',
                  minimumFractionDigits: 0
              }).format(item?.valorTotalAnexo_string || 0),
              ["Causal Devolución"]: item?.conceptoDevolucion || "",
              ["Observaciones Internas"]: item?.observacionesInternas || "",
              ["Observaciones Externas"]: item?.observacionesCliente || "",
              ["Dentro de ANS"]: item.tareaCaducada === false ? "Dentro de ANS" : item.tareaCaducada === true ? "Vencido" : "",
              ["Asignado a"]: item?.analistaGestionNameAnexos || ""
          });
          } else {
          rows.push({
              ["Prioridad"]: item?.priorizar ? 'Si' : 'No',
              ["Fecha de Solicitud"]: item?.fechaSolicitud?.split('T')[0] || "",
              ["Número de solicitud"]: item?.codigoRadicado || "",
              ["NIT Constructora"]: item?.numeroDocumento || "",
              ["Nombre Constructora"]: item?.nombreAutorizado || "",
              ["Numero de negocio"]: item?.numeroNegocio || "",
              ["Nombre de negocio"]: item?.nombreNegocio || "",
              ["Tipo anexo"]: item?.numeroAnexoContable || "",
              ["Municipio"]: item?.municipio || "",
              ["Estado"]: item?.estado || "",
              ["Año anexo"]: item?.anioAnexo || "",
              ["Mes Anexo"]: item?.mesAnexo || "",
              ["Valor total del anexo"]: new Intl.NumberFormat('es-CO', {
                  style: 'currency',
                  currency: 'COP',
                  minimumFractionDigits: 0
              }).format(item?.valorTotalAnexo_string || 0),
              ["Causal Devolución"]: item?.conceptoDevolucion || "",
              ["Observaciones Internas"]: item?.observacionesInternas || "",
              ["Observaciones Externas"]: item?.observacionesCliente || "",
              ["Dentro de ANS"]: item.tareaCaducada === false ? "Dentro de ANS" : item.tareaCaducada === true ? "Vencido" : "",
              ["Asignado a"]: item?.asignadoNombre || ""
          });
          }

      });

      const ws = XLSX.utils.json_to_sheet(rows);

      // Autoajustar columnas
      const colWidths = Object.keys(rows[0]).map((key) => {
          const maxLength = Math.max(
              key.length,
              ...rows.map((row) => (row[key] ? row[key].toString().length : 0))
          );
          return { wch: maxLength + 2 };
      });
      ws["!cols"] = colWidths;

      // Estilos para encabezados
      const headerRange = XLSX.utils.decode_range(ws["!ref"]);
      for (let col = headerRange.s.c; col <= headerRange.e.c; col++) {
          const cellAddress = XLSX.utils.encode_cell({ r: 0, c: col });
          if (ws[cellAddress]) {
              ws[cellAddress].s = {
                  fill: { fgColor: { rgb: "0B5394" } },
                  font: { bold: true, color: { rgb: "FFFF00" } },
                  alignment: { horizontal: "center", vertical: "center" },
              };
          }
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Datos");
      XLSX.writeFile(wb, fileName);
      return true;
  }

