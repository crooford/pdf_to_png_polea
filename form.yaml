  function sortTableByKey(key, columnIndex, header) {
      // Determinar dirección de orden
      const direction = sortDirection[key] === "asc" ? "desc" : "asc";
      sortDirection[key] = direction;
      selectedData = [];

      // Ordenar datos
      filteredData.sort((a, b) => {
          if (key == 'tipoDocumento') {
              const valueA = a.tipoDocumento + a.numeroDocumento;
              const valueB = b.tipoDocumento + b.numeroDocumento;

              if (typeof valueA === "string") {
                  return direction === "asc"
                      ? valueA.localeCompare(valueB)
                      : valueB.localeCompare(valueA);
              } else if (typeof valueA === "number" || valueA instanceof Date) {
                  return direction === "asc" ? valueA - valueB : valueB - valueA;
              }

          } else {
              if(key == 'solicitante'){
                  const valueA = a.nombreAutorizado;
                  const valueB = b.nombreAutorizado;
          
                  if (typeof valueA === "string") {
                      return direction === "asc"
                          ? valueA.localeCompare(valueB)
                          : valueB.localeCompare(valueA);
                  } else if (typeof valueA === "number" || valueA instanceof Date) {
                      return direction === "asc" ? valueA - valueB : valueB - valueA;
                  }
              }else{
                  const valueA = a[key];
                  const valueB = b[key];
                  if (typeof valueA === "string") {
                      return direction === "asc"
                          ? valueA.localeCompare(valueB)
                          : valueB.localeCompare(valueA);
                  } else if (typeof valueA === "number" || valueA instanceof Date) {
                      return direction === "asc" ? valueA - valueB : valueB - valueA;
                  }
              }
          }
          return 0;
      });

      // Actualizar visualización del encabezado
      const headersTo = document.querySelectorAll("#edit-tabla thead tr td");
      headersTo.forEach(h => h.classList.remove("ascending", "descending"));
      header.classList.add(direction === "asc" ? "ascending" : "descending");

      // Renderizar tabla con datos ordenados
      renderTable(filteredData, currentPage);
  }

  function filterTable() {
      const filters = {
          //priorizar: document.getElementById("filter-prioridad")?.value.toLowerCase() || "",
          fechaSolicitud: document.getElementById("filter-fechasolicitud")?.value.toLowerCase() || "",
          codigoRadicado: document.getElementById("filter-númerodesolicitud")?.value.toLowerCase() || "",
          tipoDocumento: document.getElementById("filter-nitconstructora")?.value.toLowerCase() || "",
          solicitante: document.getElementById("filter-nombreconstructora")?.value.toLowerCase() || "",
          nombreNegocio: document.getElementById("filter-númeroynombredenegocio")?.value.toLowerCase() || "",
          numeroAnexoContable: document.getElementById("filter-tipoanexo")?.value.toLowerCase() || "",
          municipio: document.getElementById("filter-municipio")?.value.toLowerCase() || "",
          estado: document.getElementById("filter-estado")?.value.toLowerCase() || "",
          asignadoNombre: document.getElementById("filter-asignadoa")?.value.toLowerCase() || "",
      };

      console.log("filters", filters)
      filteredData = data.filter(row => {
          let doctipo = (row.tipoDocumento + row.numeroDocumento || "").toLowerCase();
          return (
              doctipo.includes(filters.tipoDocumento) &&
              new Date(row.fechaSolicitud).toLocaleDateString().toLowerCase().includes(filters.fechaSolicitud) &&
              (row.codigoRadicado || "").toLowerCase().includes(filters.codigoRadicado) &&
              (row.nombreAutorizado || "").toLowerCase().includes(filters.solicitante) &&
              (row.nombreNegocio || "").toLowerCase().includes(filters.nombreNegocio) &&
              (row.numeroAnexoContable || "").toLowerCase().includes(filters.numeroAnexoContable) &&
              (row.municipio || "").toLowerCase().includes(filters.municipio) &&
              (row.estado || "").toLowerCase().includes(filters.estado) &&
              (
    (row.analistaGestionNameAnexos || "Sin asignar").toLowerCase().includes(filters.asignadoNombre) ||
    (row.asignadoNombre || "Sin asignar").toLowerCase().includes(filters.asignadoNombre)
  )
          );
      });
      console.log("data filtrada", filteredData)

      currentPage = 1; // Resetear la paginación al aplicar un filtro
      limpiarInputsHidden()
      selectedData = [];
      checkeds = [];
      //Aqui se eliminan los registros de los datos del reporte
      //  const dataClearFilter = selectedData.filter(i=> i.caseId != this.getAttribute("data-case-id"))
      //  selectedData  =  dataClearFilter
      renderTable(filteredData, currentPage);
  }


  function renderPagination(totalRows) {
      const paginationContainer = document.querySelector("#pagination");
      paginationContainer.innerHTML = ""; // Limpiar paginador
      const totalPages = Math.ceil(totalRows / rowsPerPage);
      for (let i = 1; i <= totalPages; i++) {
          const button = document.createElement("button");
          button.textContent = i;
          button.classList.add("pagination-btn");
          if (i === currentPage) button.classList.add("active");
          button.onclick = () => {
