    //console.log("fecha sin minutos:", ahora);

    // Obtener la fecha y hora exacta de hace una semana
    const semanaPasada = new Date(ahora);
    const semanaPasada2 = new Date(ahora);
    semanaPasada2.setDate(ahora.getDate() - 7); // Restar 7 días
    semanaPasada2.setHours(semanaPasada2.getHours() - 1);
    semanaPasada.setDate(ahora.getDate() - 7); // Restar 7 días

    //console.log("La semana pasada es:", semanaPasada)

    // Inicializar contadores para la semana pasada
    let totalRecibidosPasado = 0;
    let totalEnProcesoPasado = 0;
    let totalFinalizadosPasado = 0;
    let totalVencidosPasado = 0;

    // Recorrer y contar trámites
    data3.forEach(tramite => {
        if (tramite.fechaInicio) {
            let fechaInicio = new Date(tramite.fechaInicio);

            // Validar si el trámite cayó dentro del mismo rango de fecha y hora exacta hace una semana
            //let esSemanaPasada = fechaInicio >= "2025-02-18T10:00:00.00" && fechaInicio <= "2025-02-18T10:59:00.00";
            //let esSemanaPasada = fechaInicio  >= "Tue Feb 18 2025 10:00:00 GMT-0500 (hora estándar de Colombia)" && fechaInicio <= "Tue Feb 25 2025 10:00:00 GMT-0500 (hora estándar de Colombia)";
            //let esSemanaPasada = fechaInicio >= semanaPasada && fechaInicio <= ahora;
            let esSemanaPasada = fechaInicio >= semanaPasada2 && fechaInicio <= semanaPasada;

            //console.log("semana pasada:", semanaPasada);
            //console.log("fecha de hoy:", ahora);

            if (esSemanaPasada) {
                if (tramite.estado === "Radicado") {
                    totalRecibidosPasado++;
                    //totalEnProcesoPasado++; // También se considera "en proceso"
                } else if (['Finalizada', 'Cancelada'].includes(tramite.estado)) {
                    totalFinalizadosPasado++;
                } else if (!['Radicado', 'Cancelada'].includes(tramite.estado)) {
                    totalEnProcesoPasado++;
                }

                // Calcular vencidos
                const diferenciaDias = (ahora - fechaInicio) / (1000 * 60 * 60 * 24);
                if (diferenciaDias > 1) {
                    totalVencidosPasado++;
                }
            }
        }
    });

    // Calcular el total de trámites en la semana pasada
    let totalTramitesSemanaPasada =
        totalRecibidosPasado + totalEnProcesoPasado + totalFinalizadosPasado + totalVencidosPasado;

        const business_data2 = document.getElementsByName('business_data')[0]
        data2 = business_data2 ? JSON.parse(business_data2.value)[0].var : [];

        data2 = data2.filter(row =>
