      )
    );
        // Inicializar contadores
        let totalRecibidos = 0;
        let totalEnProceso = 0;
        let totalFinalizados = 0;
        let totalVencidos = 0;

        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        // Recorrer y contar por estado
        data2.forEach(tramite => {
            if (tramite.estado === "Radicado") {
                totalRecibidos++;
                //totalEnProceso++; // También se considera "en proceso"
            } else if (['Finalizada', 'Cancelada'].includes(tramite.estado)) {
                totalFinalizados++;
            } else if (['En Inclusión/Eliminación Correo', 'Finalizada Inclusión/eliminación correo', 'Habilitación/inhabilitación servicio de envío de información solicitada', 'Finalizada Marcación servicio Solicitado', 'Finalizada', 'Devuelto para corregir'].includes(tramite.estado)) {
                totalEnProceso++;
            }

            if (tramite.estado === "Cancelada") {
                totalVencidos++;
            }
        });

        // Mostrar resultados en consola
        console.log('Total recibidos:', totalRecibidos);
        console.log('Total en proceso:', totalEnProceso);
        console.log('Total finalizados:', totalFinalizados);
        console.log('Total vencidos:', totalVencidos);

        // Actualizar el dashboard
        document.querySelector("#totalTramitesRecibidos").innerHTML = totalRecibidos;
        document.querySelector("#totalTramitesProceso").innerHTML = totalEnProceso;
        document.querySelector("#totalTramitesFinalizados").innerHTML = totalFinalizados;
        document.querySelector("#totalTramitesCancelados").innerHTML = totalVencidos;


    // Calcular los porcentajes
    let porcentajeRecibidos = (((totalRecibidos - totalRecibidosPasado) / totalRecibidosPasado) * 100).toFixed(0);
    let porcentajeEnProceso = (((totalEnProceso - totalEnProcesoPasado) / totalEnProcesoPasado) * 100).toFixed(0);
    let porcentajeFinalizados = (((totalFinalizados - totalFinalizadosPasado) / totalFinalizadosPasado) * 100).toFixed(0);
    let porcentajeVencidos = (((totalVencidos - totalVencidosPasado) / totalVencidosPasado) * 100).toFixed(0);
    
    //actualizar porcentajes
    
    
    if (porcentajeRecibidos === "Infinity") {
        document.querySelector("#html > main > section.card-container > div:nth-child(1) > div.card-botom > p.card-percenteje").innerText = "0%";
