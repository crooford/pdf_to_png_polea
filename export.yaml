    console.log(`Total en proceso: ${totalEnProcesoPasado} (${porcentajeEnProceso}%)`);
    console.log(`Total finalizados: ${totalFinalizadosPasado} (${porcentajeFinalizados}%)`);
    console.log(`Total vencidos: ${totalVencidosPasado} (${porcentajeVencidos}%)`);
  }

