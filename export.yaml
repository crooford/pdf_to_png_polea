css: |
  * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
  }

  .f-main-content {
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 0px;
  }

  .score-container {
    width: 90%;
  }

  .score-wrapper {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap; /* Permite que los elementos se acomoden en dispositivos pequeños */
  }

  .score-box {
    width: 50%;
    text-align: center;
    margin-bottom: 20px; /* Espacio entre los boxes */
  }

  .score-chart {
    display: flex;
    justify-content: center;
    width: 100%; /* Ajusta el ancho al contenedor */
    max-width: 70%;  /*Asegura que no se estire más allá de 300px */
    margin-bottom: 50px;
    margin: 0 auto;
  }

  .card-container {
    width: 20%;
    margin-top: 20px;
  }
  .card{
    margin:10px;
  }

  #graficoCategoria,
  #graficoLineaNegocio {
    height: 250px !important;
    width: 250px !important;
  }

  @media (max-width: 1140px) {
    .score-box {
      width: 48%; /* En pantallas medianas, los boxes ocuparán el 48% del ancho */
    }
    
    .card-container {
      width: 48%; /* Ajusta el tamaño del contenedor de las tarjetas */
    }
  }

  @media (max-width: 768px) {
    .main-content {
      flex-direction: column; /* En pantallas pequeñas, los elementos se apilan en columna */
      gap: 20px; /* Ajusta el espacio entre los elementos */
    }
    
    .score-container {
      width: 90%; /* En pantallas pequeñas, ajustamos el ancho */
    }

    .score-wrapper {
      justify-content: center; /* Centra los elementos */
    }

    .score-box {
      width: 90%; /* Los boxes ocupan el 90% del ancho */
      margin: 10px 0;
    }

    .score-chart {
      width: 100%; /* Asegura que el gráfico ocupe el 100% de su contenedor */
      max-width: 70%;
      margin: 0 auto;
    }

    .card-container {
      width: 100%; /* Las tarjetas ocupan el 100% del ancho */
    }

    #graficoCategoria, #graficoLineaNegocio {
      width: 100% !important; /* Asegura que los gráficos sean adaptables */
      height: auto !important; /* Ajuste automático de la altura */
    }
  }

  @media (max-width: 480px) {
    .score-box {
      width: 100%; /* En pantallas muy pequeñas, los boxes ocupan el 100% */
    }

    .card-container {
      width: 100%; /* Las tarjetas ocupan el 100% */
    }

    #graficoCategoria, #graficoLineaNegocio {
      width: 100% !important;
      height: 150px !important; /* Ajusta el tamaño de los gráficos para pantallas muy pequeñas */
    }
  }
