  const calcularTiempoAtencionEnDias = (dataFiltered) => {
    let cantidad = 0;
    let diferenciaDias = 0;

    dataFiltered.forEach(element => {  
        if(element.estado && element.estado?.toLowerCase() === 'radicado'){
            cantidad++
            const fechaSolicitud = new Date(element.fechaSolicitud);
            const fechaActual = new Date(); // Fecha y hora actuales
            
            // Calcular la diferencia en milisegundos y convertirla a días
            let diasDiferencia = (fechaActual - fechaSolicitud) / (1000 * 3600 * 24);
            
            diferenciaDias += diasDiferencia;
        }
    });

    let promedio = cantidad > 0 ? diferenciaDias / cantidad : 0;


    return {
      tiempoAtencionDias: parseFloat(promedio), // Redondear a días completos
      estado: ''
    };
  };

